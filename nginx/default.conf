upstream django_backend {
    server django:8000;
}

upstream streamlit_dashboard {
    server streamlit:8501;
}

server {
    listen 80;
    server_name localhost nextgenkpi.com www.nextgenkpi.com;

    client_max_body_size 20M;

    # 1. Serve Django Static Files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Serve User-Uploaded Media Files
    location /media/ {
        alias /app/mediafiles/;
    }

    # 3. Route Django Admin Panel & REST API to Gunicorn
    location ~ ^/(admin|api)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Route Streamlit Dashboards (including WebSockets)
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        proxy_pass http://streamlit_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /dashboard/_stcore/stream {
        proxy_pass http://streamlit_dashboard/dashboard/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 5. Redirect root URL straight to the dashboard
    location = / {
        return 301 /dashboard/;
    }
}
