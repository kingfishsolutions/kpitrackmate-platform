name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/kingfishsolutions/kpitrackmate/kpitrackmate-platform
            git fetch origin main
            git reset --hard origin/main

            # Activate virtual environment and update dependencies
            source /opt/kingfishsolutions/streamlitapp/venv/bin/activate
            pip install -r requirements.txt

            # Apply any new Django database migrations & static files
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Restart your live services (replace with your exact service names)
            sudo systemctl restart gunicorn
            sudo systemctl restart streamlit